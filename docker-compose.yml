

services:
# 1. Сервер базы PostgreSQL
  db:
    image: postgres:16
    container_name: reserve_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reserve_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

# 2. сервера redis
  redis:
    image: redis:latest
    container_name: reserve_redis
    ports:
      - "6379:6379"

  # 3. Наш бэкенд FastAPI
  web:
    build: .
    container_name: reserve_fastapi
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/reserve_db
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis

volumes:
  postgres_data:


